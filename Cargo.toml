[package]
name = "mc"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
digest = "0.10"
md-5 = "0.10"
md2 = "0.10"
md4 = "0.10"
ripemd = "0.1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
uuid = { version = "1", default-features = false, features = ["std"] }
whirlpool = "0.10"

[profile.release]
strip = true
lto = true
